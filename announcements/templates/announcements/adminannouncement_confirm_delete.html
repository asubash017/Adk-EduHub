{% extends "core/base.html" %}

{% block title %}Delete Admin Announcement{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2>Delete Admin Announcement</h2>
  <p>Are you sure you want to delete the admin announcement titled "<strong>{{ object.title }}</strong>"?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'announcement_list' %}" class="btn btn-secondary ms-2">Cancel</a>
  </form>
</div>
{% endblock %}
