
{% for announcement in announcements %}
    <div class="announcement-card">
        <h3>{{ announcement.title }}</h3>
        <p>{{ announcement.content }}</p>
        <p><small>Visible to: {{ announcement.get_role_visible_to_display }}</small></p>

        {% if user.role in 'admin teacher' %}
            <a href="{% url 'announcements:edit' announcement.id %}">Edit</a> |
            <a href="{% url 'announcements:delete' announcement.id %}">Delete</a>
        {% endif %}
    </div>
{% endfor %}

{% if user.role in 'admin teacher' %}
    <a href="{% url 'announcements:create' %}" class="btn btn-primary">Add Announcement</a>
{% endif %}
