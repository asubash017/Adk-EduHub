{% extends 'core/base.html' %}

{% block content %}
<div class="card p-3 shadow-sm mb-4">
    <h2>Submit Assignment: {{ assignment.title }}</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <label for="{{ form.file.id_for_label }}" class="form-label">Upload File</label>
            {{ form.file }}
            {% if form.file.errors %}
                <div class="text-danger">{{ form.file.errors }}</div>
            {% endif %}
        </div>

        <div class="mb-3">
            <label for="{{ form.text.id_for_label }}" class="form-label">Text (optional)</label>
            {{ form.text }}
            {% if form.text.errors %}
                <div class="text-danger">{{ form.text.errors }}</div>
            {% endif %}
        </div>

        <button type="submit" class="btn btn-success">Submit</button>
        <a href="{% url 'assignments:assignment_detail' assignment.pk %}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>
{% endblock %}
