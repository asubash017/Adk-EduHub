{% for comment in comments %}
<div class="comment" id="comment-{{ comment.id }}">
    <p><strong>{{ comment.user.username }}</strong>: {{ comment.content }}</p>
    
    <!-- Like/Dislike -->
    <a href="#" class="like-btn" data-id="{{ comment.id }}">👍 <span class="like-count">{{ comment.likes.count }}</span></a>
    <a href="#" class="dislike-btn" data-id="{{ comment.id }}">👎 <span class="dislike-count">{{ comment.dislikes.count }}</span></a>

    <!-- Reply Form -->
    <form method="POST" action="{% url 'notes:note_detail' note.pk %}" class="reply-form">
        {% csrf_token %}
        <input type="hidden" name="parent" value="{{ comment.id }}">
        <input type="text" name="content" placeholder="Reply..." required>
        <button type="submit">Reply</button>
    </form>

    {% for reply in comment.replies.all %}
    <div class="reply ms-4">
        <strong>{{ reply.user.username }}</strong>: {{ reply.content }}
        <a href="{% url 'notes:note_comment_delete' reply.id %}">Delete</a>
    </div>
    {% endfor %}
</div>
{% endfor %}

<script>
const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;

document.querySelectorAll('.like-btn').forEach(btn=>{
    btn.addEventListener('click', function(e){
        e.preventDefault();
        const commentId = this.dataset.id;

        fetch(`/notes/comment/like/${commentId}/`, {
            method: 'POST',
            headers: {'X-CSRFToken': csrftoken},
        })
        .then(res => res.json())
        .then(data => {
            const div = document.getElementById(`comment-${commentId}`);
            div.querySelector('.like-count').innerText = data.likes;
            div.querySelector('.dislike-count').innerText = data.dislikes;
        });
    });
});

document.querySelectorAll('.dislike-btn').forEach(btn=>{
    btn.addEventListener('click', function(e){
        e.preventDefault();
        const commentId = this.dataset.id;

        fetch(`/notes/comment/dislike/${commentId}/`, {
            method: 'POST',
            headers: {'X-CSRFToken': csrftoken},
        })
        .then(res => res.json())
        .then(data => {
            const div = document.getElementById(`comment-${commentId}`);
            div.querySelector('.like-count').innerText = data.likes;
            div.querySelector('.dislike-count').innerText = data.dislikes;
        });
    });
});
</script>
