{% extends 'core/base.html' %}
{% block content %}
  <h2>{% if edit %}Edit Note{% else %}Upload Note{% endif %}</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">{% if edit %}Update{% else %}Upload{% endif %}</button>
  </form>
{% endblock %}
