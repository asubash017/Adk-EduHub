{% extends 'core/base.html' %}
{% load static %}


{% block title %}{{ form.instance.pk|yesno:"Edit Course,Add Course" }}{% endblock %}

{% block content %}
<h2>{{ form.instance.pk|yesno:"Edit Course,Add New Course" }}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    <a href="{% url 'course_list' %}">Cancel</a>
</form>
{% endblock %}
